name: New Game Radar

on:
  workflow_dispatch:
    inputs:
      serper_verify_limit:
        description: "Serper 每轮验证上限。冒烟测试选 2（只消耗 2 次额度）；正式跑选 90"
        type: choice
        options:
          - "90"
          - "10"
          - "2"
        default: "90"
      trends_verify_limit:
        description: "免费 Google Trends 每轮上限（scan.mjs 硬夹 10）。限流或要关掉选 0"
        type: choice
        options:
          - "10"
          - "3"
          - "0"
        default: "10"
      free_seo_verify_limit:
        description: "免费 SEO 每轮上限（DuckDuckGo/Brave，0 关掉）。被限流就调小或选 0"
        type: choice
        options:
          - "20"
          - "50"
          - "0"
        default: "20"
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: new-game-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US

      # Direct/free Google verification paths.
      # SEO 的权威结论仍然走 Serper（Google 索引）。下面这条是**免费的补充路径**：
      # 没配 BRAVE_SEARCH_API_KEY 时 lib/seo-verifier.mjs 自动走 DuckDuckGo HTML
      # （零 key、零额度），配了就优先用 Brave（免费档 $5/月赠金 ≈ 1,000 次，
      # 用完自动降级回 DuckDuckGo，不会卡住）。
      #
      # 它只补空缺，不覆盖 Serper 的结论：scan.mjs 的 needsSeoCheck 会跳过
      # provider 为 serper+autocomplete 且模型版本当前的候选。免费结论自己按
      # 7 天保鲜（FREE_VERIFY_MAX_AGE）。
      # 被 DuckDuckGo 拦截时 lib/seo-verifier.mjs 的 duckBlockReason 会抛
      # code='SEO_BLOCKED' 的错误；scan.mjs 把它记成 classification:'pending'
      # + blocked 标记（不是 error —— 拦截是「没拿到结论」，不是「结论不合格」），
      # 并且连续命中 FREE_SEO_ABORT_AFTER 次就熔断本轮。绝不允许静默变成假结论。
      SEO_VERIFY_LIMIT: ${{ inputs.free_seo_verify_limit || 20 }}
      # 连续被拦截多少次就熔断本轮（scripts/scan.mjs）。2026-09-17 实测 run #16：
      # 19 次尝试 18 次被拦（95%）。不熔断就是每轮白刷 20 个候选成失败 + 白等 850ms×20。
      FREE_SEO_ABORT_AFTER: 5
      # 被拦占多数时整体退避多久（毫秒）。退避期间队列为空、一个候选都不消耗，
      # 状态存 data/state.json；一旦有一轮不再被拦就自动解除。
      # 想更激进地试探就调小，想彻底别试就调大或直接把 SEO_VERIFY_LIMIT 设 0。
      FREE_SEO_BLOCK_COOLDOWN: 21600000
      # Brave 免费档是 $5/月赠金、$5/1k 请求 → 约 1,000 次/月。按 30 天摊平。
      # 没配 key 时这两个值不起作用。
      BRAVE_SEARCH_MONTHLY_LIMIT: 900
      BRAVE_SEARCH_DAILY_LIMIT: 30
      # keyless Google Trends 路径也是开的：它不花钱，而且是 keywordFreshness
      # 的唯一来源，而 independent 需要它。scan.mjs 硬夹 10/轮防限流。
      TRENDS_VERIFY_LIMIT: ${{ inputs.trends_verify_limit || 10 }}
      SEO_EXPAND_LIMIT: 0
      # Minimum gap between requests on the free path (lib/trend-verifier.mjs).
      TRENDS_FREE_DELAY_MS: 1200
      YOUTUBE_VERIFY_LIMIT: 0

      # Third-party Google Search provider: Serper.dev.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      # Optional extra accounts. Each key is a separate Serper account with its
      # own 2500-query one-time allowance, pooled by scripts/verify-serper-pool.mjs.
      # Unconfigured slots are skipped. Adding accounts is the only way to raise
      # throughput, because the free allowance never resets.
      SERPER_API_KEY_2: ${{ secrets.SERPER_API_KEY_2 }}
      SERPER_API_KEY_3: ${{ secrets.SERPER_API_KEY_3 }}
      SERPER_API_KEY_4: ${{ secrets.SERPER_API_KEY_4 }}
      SERPER_API_KEY_5: ${{ secrets.SERPER_API_KEY_5 }}
      # 手动触发时可用 inputs 覆盖（冒烟测试选 2）。schedule / push 触发时
      # inputs 为空，`|| 90` 回落到正式值。
      SERPER_VERIFY_LIMIT: ${{ inputs.serper_verify_limit || 90 }}
      SERPER_ONLINE_LIMIT: 63
      SERPER_WIKI_LIMIT: 27
      SERPER_MIN_PRIORITY: 80
      SERPER_TOTAL_LIMIT: 2450
      # 日上限必须远小于总上限，否则等于没有日上限：满速 90 × 6.5 轮 ≈ 585/天，
      # 2450 只够跑 4 天，之后就是上游那 7 周的「job 全绿、verified 恒为 0」。
      # 免费额度 2500 是一次性的，2450 / 30 天 ≈ 80 → 能铺满一个月。
      SERPER_DAILY_LIMIT: 80
      # SEO 结论的保鲜期（lib/seo-freshness.mjs）。SERP 结论会过期，所以日额度
      # 不是「今天有多少新游戏」的预算，而是「让每个已验词保持新鲜」的预算。
      # 天花板 = 日额度 × 保鲜天数，旧的全局限定 3 天时只有 240 个词 —— 低于
      # 积压量，意味着永远追不上，而且验得越成功欠的重验债越多。
      # 分档后同样 348 个已验词的重验成本从 116 次/天降到 30 次/天。
      SERPER_REVERIFY_DAYS_PAGE: 14
      SERPER_REVERIFY_DAYS_WATCH: 7
      SERPER_REVERIFY_DAYS_REJECT: 30
      SERPER_REVERIFY_DAYS_DEFAULT: 3

      # When Serper is unavailable, strong multi-platform evidence can route a
      # candidate to Trends provisionally. It can never create an independent
      # recommendation until a real SERP provider confirms search intent.
      SEO_EVIDENCE_FALLBACK_LIMIT: 180

      # Official social APIs for online and Steam-game promotion velocity. Every provider
      # is optional; unavailable providers are skipped without failing the scan.
      SOCIAL_VERIFY_LIMIT: 35
      SOCIAL_MAX_AGE_MS: 21600000
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TIKTOK_RESEARCH_TOKEN: ${{ secrets.TIKTOK_RESEARCH_TOKEN }}

      # Google Trends provider pool: each key is a separate SerpApi account.
      # Keep every configured key in the job environment so both quota checks
      # and the pooled verifier see the same accounts.
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
      SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
      SERPAPI_API_KEY_4: ${{ secrets.SERPAPI_API_KEY_4 }}
      SERPAPI_API_KEY_5: ${{ secrets.SERPAPI_API_KEY_5 }}
      SERPAPI_MONTHLY_LIMIT: 245
      # 日上限必须远小于月上限，否则一轮就把整月额度吃掉。
      # 245 / 30 天 ≈ 8 → 每天最多 8 次（每个槽位各自计），额度能撑满一个月。
      # 不要把它设成和 MONTHLY_LIMIT 一样大（上游就是这么配的，等于单轮烧光整月）。
      SERPAPI_DAILY_LIMIT: 8
      SERPAPI_FILL_ENABLED: true
      SERPAPI_ONLINE_LIMIT: 999
      SERPAPI_WIKI_LIMIT: 999
      SERPAPI_FLEX_LIMIT: 999

      # SearchApi Google Trends fallback. Single concurrency is slower but much
      # more reliable than the previous three simultaneous browser jobs.
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
      SEARCHAPI_TRENDS_ENABLED: true
      # 95 是一次性赠额（不是月额度），不要和 SEARCHAPI_TOTAL_LIMIT 设成同一个数：
      # fill-searchapi-trends.mjs:34 的 effectiveLimit = min(verifyLimit, 剩余额度)，
      # 两边都是 95 → 第一轮就发满 95 次，然后永久为 0。
      # 8/轮 ≈ 12 轮反馈窗口，够在烧完之前发现系统性问题。
      # online/wiki 按原 67:28 缩到 6:2，否则 online 会吃满整个队列、wiki 永远轮不到。
      SEARCHAPI_TRENDS_VERIFY_LIMIT: 8
      SEARCHAPI_TRENDS_ONLINE_LIMIT: 6
      SEARCHAPI_TRENDS_WIKI_LIMIT: 2
      SEARCHAPI_TRENDS_CONCURRENCY: 1
      SEARCHAPI_TOTAL_LIMIT: 95
      SEARCHAPI_TIMEOUT_MS: 90000

      # Keep Apify connected for account visibility, but disable all Actor calls.
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APIFY_TRENDS_ENABLED: false
      APIFY_TRENDS_VERIFY_LIMIT: 0
      APIFY_TRENDS_ONLINE_LIMIT: 0
      APIFY_TRENDS_WIKI_LIMIT: 0

    steps:
      # v4 打的是 Node 20，runner 已经在 2025-09 起把它强制升到 Node 24 并每次运行
      # 打一条 deprecation 注解。v5 是官方为 Node 24 发布的版本，行为与 v4 一致
      # （只要求 runner ≥ v2.327.1，ubuntu-latest 早就满足）。
      # 不直接跳 v7：v6 改了凭据持久化方式、setup-node v5 起会按 packageManager
      # 字段自动开缓存 —— 本仓库最后一步是 `git push`，不值得为省一个版本号去赌。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install scanner dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Apify account token without running an Actor
        run: node scripts/check-apify-account.mjs

      - name: Run parser and scoring tests
        run: npm test

      - name: Discover games and build source evidence
        env:
          # Optional: when configured, trailer/gameplay velocity becomes a Wiki
          # prelaunch signal. The scanner safely skips this check when absent.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_VERIFY_LIMIT: 20
        run: npm run scan

      - name: Classify online and wiki channels before verification
        run: npm run classify

      - name: Verify fresh SEO candidates with the Serper account pool
        run: node scripts/verify-serper-pool.mjs

      - name: Diagnose pending evidence candidates
        run: node scripts/diagnose-evidence-fallback.mjs

      - name: Route strong candidates with quota-free platform evidence
        run: node scripts/verify-evidence-fallback.mjs

      - name: Recalculate typed site classification
        run: npm run classify

      - name: Verify independent social spillover for game candidates
        run: node scripts/verify-social-buzz.mjs

      - name: Inspect all SerpApi account quotas without spending searches
        run: node scripts/check-serpapi-accounts.mjs

      - name: Verify eligible Trends candidates with SerpApi account pool
        run: node scripts/fill-serpapi-pool.mjs

      - name: Restore SerpApi usage report
        run: node scripts/fill-serpapi-pool.mjs --report-only

      - name: Fill remaining Trends queue with SearchApi
        run: node scripts/fill-searchapi-trends.mjs

      - name: Finalize online and wiki opportunity counts
        run: npm run classify

      # Upstream ran a green job for seven weeks while verifying nothing, because
      # quota exhaustion and a missing key only wrote a log line. This turns the
      # same conditions into annotations on the run page and a job summary, so a
      # dead chain cannot hide behind a green check. It never fails the job: the
      # scan still records discoveries and the commit step must still run.
      - name: Report radar health as annotations
        if: always()
        run: node scripts/report-health.mjs

      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: scan and verify game opportunities"
          git push
